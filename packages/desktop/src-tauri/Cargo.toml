[package]
name = "opencode-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
