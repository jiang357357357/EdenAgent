name: AgentCore Rust

on:
  push:
    paths:
      - "AgentCore/**"
      - "Server/src/mon_agent_server/native_runtime/**"
      - ".github/workflows/agentcore-rust.yml"
  pull_request:
    paths:
      - "AgentCore/**"
      - "Server/src/mon_agent_server/native_runtime/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgentCore
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  package-native:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
            shell: pwsh
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: windows-arm64
            shell: pwsh
          - runner: macos-13
            target: x86_64-apple-darwin
            artifact: macos-x64
            shell: bash
          - runner: macos-14
            target: aarch64-apple-darwin
            artifact: macos-arm64
            shell: bash
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
            shell: bash
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-arm64
            shell: bash
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: AgentCore/scripts/package.ps1 -Target '${{ matrix.target }}'
      - if: runner.os != 'Windows'
        shell: bash
        run: sh AgentCore/scripts/package.sh '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: mon-agent-runtime-${{ matrix.artifact }}
          path: AgentCore/dist/${{ matrix.artifact }}/

  package-musl:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: linux-x64-musl
          - target: aarch64-unknown-linux-musl
            artifact: linux-arm64-musl
    steps:
      - uses: actions/checkout@v4
      - uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--locked --release --manifest-path AgentCore/Cargo.toml -p mon-agent-runtime"
          strip: true
      - shell: bash
        env:
          OUTPUT_ROOT: ${{ github.workspace }}/AgentCore/dist
        run: |
          mkdir -p "AgentCore/dist/${{ matrix.artifact }}"
          cp "AgentCore/target/${{ matrix.target }}/release/mon-agent-runtime" "AgentCore/dist/${{ matrix.artifact }}/"
          cd "AgentCore/dist/${{ matrix.artifact }}"
          sha256sum mon-agent-runtime > mon-agent-runtime.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mon-agent-runtime-${{ matrix.artifact }}
          path: AgentCore/dist/${{ matrix.artifact }}/
