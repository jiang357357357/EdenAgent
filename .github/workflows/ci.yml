name: Eden Agent CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typescript-host:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --ignore-scripts
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - if: runner.os == 'Linux'
        run: node --import tsx -e "import('@eden/execution').then(async ({probeSandbox}) => { const result = await probeSandbox(); if (!result.available) throw new Error(result.detail) })"
      - run: npm run typecheck:server
      - run: npm run check:architecture
      - run: npm run test:architecture
      - run: node Script/Project/inventory-runtime.mjs --check
      - run: npm run test:server
      - run: npm run build:server
      - run: node Script/Project/smoke_server_artifact.mjs
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm --prefix frontend ci --ignore-scripts
      - run: npm --prefix frontend/web run typecheck
      - run: npm --prefix frontend/web test
      - run: npm --prefix frontend/desktop test
