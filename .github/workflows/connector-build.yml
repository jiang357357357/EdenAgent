name: TypeScript connector packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck:server
      - run: npm run check:architecture
      - run: node --import tsx --test Server/tests/integration/connectors/authoring.test.ts Server/tests/connector-component.test.ts Server/tests/connector-capability-input.test.ts packages/plugin-sdk/tests/connector-wire.test.ts
