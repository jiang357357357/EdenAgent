name: TS desktop distribution

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win32
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HUSKY: '0'
      EDEN_AGENT_AUTH_MODE: production
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            frontend/desktop/native/win32-pointer-observer -> target
      - name: Install source dependencies
        run: npm ci --ignore-scripts
      - name: Install desktop packager
        run: npm --prefix frontend ci --ignore-scripts
      - name: Generate browser protocol
        run: npm run generate:rpc
      - name: Build TS host and offline migration tools
        run: npm run build:server
      - name: Build official native workers
        run: cargo build --release --locked -p eden-agent-connector-hoi4 -p eden-agent-connector-lichess -p eden-agent-connector-openttd -p eden-agent-connector-victoria3
      - name: Assemble official connector resources
        run: |
          node Script/Project/package_connector.mjs hoi4 --profile release
          node Script/Project/package_connector.mjs lichess --profile release
          node Script/Project/package_connector.mjs openttd --profile release
          node Script/Project/package_connector.mjs victoria3 --profile release
      - name: Assemble private Node runtime distribution
        run: node Script/Project/package_server.mjs
      - name: Build web application
        run: npm --prefix frontend/web run build
      - name: Build Windows pointer observer
        if: runner.os == 'Windows'
        run: npm --prefix frontend run build:pointer-observer:win
      - name: Assemble Electron desktop
        run: node frontend/Script/Project/package_desktop.mjs ${{ matrix.platform }} x64
      - name: Archive desktop with executable modes and links
        run: node frontend/Script/Project/archive_desktop.mjs ${{ matrix.platform }} x64
      - name: Upload desktop distribution
        uses: actions/upload-artifact@v4
        with:
          name: eden-agent-desktop-${{ matrix.platform }}-x64-${{ github.sha }}
          path: frontend/dist/releases/
          if-no-files-found: error
          retention-days: 7
