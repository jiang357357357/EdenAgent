[workspace]
resolver = "2"
members = [
    "AgentCore/crates/eden-agent-domain",
    "AgentCore/crates/eden-agent-core",
    "AgentCore/crates/eden-agent-tools",
    "Connectors/official/hoi4/worker",
    "Connectors/official/lichess/worker",
    "Connectors/official/openttd/worker",
    "Connectors/official/victoria3/worker",
    "Server",
    "Server/crates/eden-agent-api",
    "Server/crates/eden-agent-app",
    "Server/crates/eden-agent-blob",
    "Server/crates/eden-agent-connectors",
    "Server/crates/eden-agent-connector-host",
    "Server/crates/eden-agent-connector-package",
    "Server/crates/eden-agent-connector-protocol",
    "Server/crates/eden-agent-core-sync",
    "Server/crates/eden-agent-environment",
    "Server/crates/eden-agent-interaction",
    "Server/crates/eden-agent-host",
    "Server/crates/eden-agent-hoi4",
    "Server/crates/eden-agent-multiagent",
    "Server/crates/eden-agent-mcp",
    "Server/crates/eden-agent-market",
    "Server/crates/eden-agent-provider",
    "Server/crates/eden-agent-sandbox",
    "Server/crates/eden-agent-plugins",
    "Server/crates/eden-agent-skills",
    "Server/crates/eden-agent-store",
    "Server/crates/eden-agent-workspace",
    "Server/crates/eden-agent-victoria3",
]

[workspace.package]
version = "1.8.0"
edition = "2024"
rust-version = "1.85"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
ed25519-dalek = "2"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
globset = "0.4"
hex = "0.4"
http = "1"
ignore = "0.4"
libc = "0.2"
mime_guess = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rmcp = { version = "1.8.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
schemars = { version = "0.8", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shakmaty = "0.30.1"
sha2 = "0.10"
similar = "2"
sqlx = { version = "0.8", features = ["json", "runtime-tokio-rustls", "sqlite", "uuid"] }
thiserror = "2"
tiktoken-rs = "0.12"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ts-rs = { version = "12", features = ["no-serde-warnings", "serde-json-impl", "uuid-impl"] }
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
