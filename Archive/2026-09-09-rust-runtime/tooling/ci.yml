name: Eden Agent CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-command-runtime:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify native PowerShell execution and permission boundaries
        run: cargo test -p eden-agent-tools -p eden-agent-workspace -p eden-agent-sandbox -p eden-agent-server --locked

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Verify generated RPC client matches Rust API
        shell: bash
        run: |
          generated_rpc="$RUNNER_TEMP/eden-agent-rpc.ts"
          cargo run -p eden-agent-api --bin generate-types --locked -- "$generated_rpc"
          diff -u --strip-trailing-cr frontend/web/src/generated/eden-agent-rpc.ts "$generated_rpc"
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend/web run typecheck
      - run: npm --prefix frontend/web test
      - run: npm --prefix frontend/desktop test
