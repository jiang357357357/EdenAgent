[workspace]
resolver = "2"
members = [
    "Server/connectors/official/hoi4/worker",
    "Server/connectors/official/lichess/worker",
    "Server/connectors/official/openttd/worker",
    "Server/connectors/official/victoria3/worker",
    "Native/crates/eden-agent-connector-protocol",
    "Native/crates/eden-agent-hoi4",
    "Native/crates/eden-agent-openttd",
    "Native/crates/eden-agent-victoria3",
]

[workspace.package]
version = "1.10.1"
edition = "2024"
rust-version = "1.85"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
futures = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shakmaty = "0.30.1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
